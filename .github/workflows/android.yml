name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # Alternative options: adopt, microsoft, etc.
          java-version: '11'   # Matches the JVM target in your Gradle configuration

      # Step 3: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34        # Matches your compileSdk
          build-tools: 34.0.0  # Build tools for API 34
          ndk: '23.1.7779620'  # Optional, required only for native code

      # Step 5: Export environment variables for secrets
      #- name: Set up environment variables
      #  env:
      #    SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      #    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # Step 6: Build the project
      - name: Build the project
        run: ./gradlew assembleDebug

      # Step 7: Run unit tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Step 8: Run linting
      - name: Run Lint checks
        run: ./gradlew lint
